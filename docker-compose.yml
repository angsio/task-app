services:

  taskapp-server:
    build: ./server
    container_name: taskapp-server
    env_file:
      - "./server/.env"
    # These override anything of the same name in .env, so that file can stay on
    # its dev values and never be edited when deploying. auth-server is reachable
    # by container name because both stacks share the external `web` network.
    environment:
      AUTH_URL: "http://auth-server:5002"
      ALLOWED_ORIGINS: "https://tasks.frangiclave.com"
    # Metrics are written inside the container, so without this they sit in the
    # writable layer that a rebuild replaces. Bound to a folder on the host
    # rather than a named volume, so the report can read it without docker exec
    # and an eval run from this directory lands beside the live telemetry.
    volumes:
      - ./server/metrics/data:/app/metrics/data
    restart: unless-stopped
    networks:
      - web

  taskapp-client:
    build: ./client
    container_name: taskapp-client
    ports:
      - "8082:80"
    depends_on:
      - taskapp-server
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true